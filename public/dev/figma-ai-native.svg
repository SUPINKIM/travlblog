<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#16161f"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.2" cy="0.3" r="0.5">
      <stop offset="0%" stop-color="#A259FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#A259FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.85" cy="0.75" r="0.55">
      <stop offset="0%" stop-color="#1ABCFE" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1ABCFE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cfd0e0"/>
    </linearGradient>
    <linearGradient id="aiGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A259FF"/>
      <stop offset="50%" stop-color="#F24E1E"/>
      <stop offset="100%" stop-color="#1ABCFE"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glowA)"/>
  <rect width="1200" height="630" fill="url(#glowB)"/>

  <g opacity="0.18" stroke="#ffffff" stroke-width="1">
    <path d="M0 160 H1200" />
    <path d="M0 320 H1200" />
    <path d="M0 480 H1200" />
    <path d="M200 0 V630" />
    <path d="M500 0 V630" />
    <path d="M800 0 V630" />
    <path d="M1050 0 V630" />
  </g>

  <g transform="translate(880, 130)">
    <circle cx="40" cy="40" r="40" fill="#F24E1E"/>
    <circle cx="40" cy="120" r="40" fill="#A259FF"/>
    <circle cx="40" cy="200" r="40" fill="#1ABCFE"/>
    <path d="M80 80 a40 40 0 0 1 -40 40 a40 40 0 0 1 -40 -40 a40 40 0 0 1 40 -40 z" fill="#FF7262"/>
    <circle cx="120" cy="120" r="40" fill="#0ACF83"/>
  </g>

  <g transform="translate(880, 130)" opacity="0.5">
    <circle cx="40" cy="40" r="40" fill="none" stroke="#ffffff" stroke-width="1"/>
    <circle cx="40" cy="200" r="40" fill="none" stroke="#ffffff" stroke-width="1"/>
    <circle cx="120" cy="120" r="40" fill="none" stroke="#ffffff" stroke-width="1"/>
  </g>

  <g transform="translate(80, 110)">
    <rect x="0" y="0" width="120" height="34" rx="17" fill="rgba(162, 89, 255, 0.12)" stroke="rgba(162, 89, 255, 0.5)"/>
    <text x="60" y="22" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#C9A6FF" letter-spacing="1.5">DESIGN × DEV</text>
  </g>

  <text x="80" y="260" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="110" font-weight="800" fill="url(#titleGrad)" letter-spacing="-3">
    Figma
  </text>

  <text x="80" y="380" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="110" font-weight="800" fill="url(#aiGrad)" letter-spacing="-3">
    AI Native
  </text>

  <text x="80" y="450" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="26" font-weight="400" fill="#9aa0b4" letter-spacing="0.3">
    디자인 툴이 AI를 품으면, 우리의 워크플로우는 어떻게 바뀔까
  </text>

  <g transform="translate(80, 520)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#7a7f95">
    <rect x="0" y="0" width="10" height="10" fill="#0ACF83"/>
    <text x="22" y="10">supin.log</text>
    <text x="120" y="10" fill="#5b6076">/</text>
    <text x="140" y="10">dev</text>
  </g>
</svg>
